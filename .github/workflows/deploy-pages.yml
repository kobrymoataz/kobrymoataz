# Branch publishing remains Settings -> Pages -> Deploy from a branch -> main /docs.
# This action VALIDATES only and never performs an additional deployment.
name: Validate V24 portfolio (branch publishing)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'assets/**'
      - 'scripts/validate_site.py'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'assets/**'
      - 'scripts/validate_site.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Validate static portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate files, anchors, multilingual coverage and private CV request
        run: python scripts/validate_site.py
      - name: Verify JavaScript syntax
        run: |
          node --check docs/i18n.js
          node --check docs/lab.js
          node --check docs/app.js
          node --check docs/globe.js
