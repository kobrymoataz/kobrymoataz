# GitHub Pages remains configured to deploy from main /docs (no competing deploy job).
name: Validate portfolio (branch publishing)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'scripts/validate_site.py'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'scripts/validate_site.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate portfolio assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and README
        run: python scripts/validate_site.py
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/globe-v21.js
