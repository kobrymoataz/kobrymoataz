# GitHub Pages source: Settings > Pages > Deploy from a branch > main /docs.
# This workflow validates files only. It MUST NOT deploy, to avoid two publishers.
name: Validate portfolio (branch publishing)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'scripts/validate_site.py'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'scripts/validate_site.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate assets and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and README
        run: python scripts/validate_site.py
      - name: Check JavaScript syntax
        run: node --check docs/script.js
