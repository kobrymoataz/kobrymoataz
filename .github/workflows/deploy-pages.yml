# GitHub Pages keeps its configured branch-based publishing source main /docs.
# This workflow validates the portfolio and never deploys a competing site.
name: Validate V31.2 Security Evidence portfolio (branch publishing)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'assets/**'
      - 'scripts/validate_site.py'
      - 'scripts/test_studio.mjs'
      - 'scripts/test_flow_v28.mjs'
      - 'scripts/test_perspective_v29.mjs'
      - 'scripts/test_trustops_v30.mjs'
      - 'scripts/test_repo_audit_v30_2.mjs'
      - 'scripts/test_automation_v31.mjs'
      - 'scripts/test_quality_v31_1.mjs'
      - 'scripts/test_security_evidence_v31_2.mjs'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'assets/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Validate static portfolio and browser-local engineering engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate assets, links, multilingual coverage and private CV policy
        run: python3 scripts/validate_site.py
      - name: Validate JavaScript syntax
        run: |
          for file in docs/i18n.js docs/lab.js docs/app.js docs/globe.js docs/perspective.js docs/studio-engine.js docs/studio-flow-engine.js docs/studio-flow-ui.js docs/studio.js docs/trustops.js docs/trustops-core.mjs docs/repo-audit.js docs/repo-audit-core.mjs docs/automation.js docs/automation-core.mjs docs/security-evidence-core.mjs; do node --check "$file"; done
      - name: Check Git-format object engine
        run: node scripts/test_studio.mjs
      - name: Check real local workflow graph, queue and trace behavior
        run: node scripts/test_flow_v28.mjs
      - name: Check V29 atlas, globe compatibility and public evidence
        run: node scripts/test_perspective_v29.mjs

      - name: Check TrustOps DNS audit and uncertainty semantics (offline fixtures)
        run: node scripts/test_trustops_v30.mjs

      - name: Check TrustOps repository evidence and OSV/Scorecard uncertainty
        run: node scripts/test_repo_audit_v30_2.mjs

      - name: Check V31 local automation static analysis, editing and incident evidence
        run: node scripts/test_automation_v31.mjs
      - name: Check V31.1 progressive loading and accessible workflow editing
        run: node scripts/test_quality_v31_1.mjs

      - name: Check V31.2 security configuration and sanitized evidence pack
        run: node scripts/test_security_evidence_v31_2.mjs
